# ============================================
# POSTGRESQL CONFIGURATION
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fordchallenge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# FLYWAY MIGRATIONS
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================
# SWAGGER / OPENAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================
# MVC - evita conflito de rotas com recursos estaticos
# ============================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ============================================
# JWT
# ============================================
# Chave secreta usada para assinar o token (min. 256 bits para HS256). Troque em producao!
jwt.secret=6d82360a9a735b5967a3773204fd7eb16cd93e346e66f1cf181c76c9fc805346
# Tempo de expiracao do token em milissegundos (aqui: 1 hora)
jwt.expiration-ms=3600000

# ============================================
# LOGGING
# ============================================
logging.level.com.example.challenge=DEBUG
logging.level.org.springframework.web=INFO

# ============================================
# CORS - origens permitidas (separar por virgula, sem espacos)
# ============================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}