# ============================================
# POSTGRESQL CONFIGURATION
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ford_challenge
spring.datasource.username=postgres
spring.datasource.password=170105
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# FLYWAY MIGRATIONS
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================
# SWAGGER / OPENAPI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================
# MVC - evita conflito de rotas com recursos estaticos
# ============================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ============================================
# JWT
# ============================================
# Chave secreta usada para assinar o token (m?n. 256 bits para HS256). Troque em produ??o!
jwt.secret=6d82360a9a735b5967a3773204fd7eb16cd93e346e66f1cf181c76c9fc805346
# Tempo de expira??o do token em milissegundos (aqui: 1 hora)
jwt.expiration-ms=3600000

# ============================================
# LOGGING
# ============================================
logging.level.com.example.challenge=DEBUG
logging.level.org.springframework.web=INFO